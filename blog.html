
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="article.css">

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7011005908068222"
    crossorigin="anonymous">
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

  <title>Blog</title>
</head>

<body>

  <header class="blog-header">
    <nav class="nav">
      <div class="nav-container">
        <div class="logo">Samiha's Blog</div>

        <button class="nav-toggle" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <ul class="nav-links">
         <li><a href="index.html#about">About</a></li>
         <li><a href="index.html#book">Book</a></li>
         <li><a href="index.html#contact">Contact</a></li>
         <li><a href="projects.html">Projects</a></li>
         <li><a href="blog.html">Blog</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="categories">
    <button type="button" onclick="showCategory('personal', this)">
      Personal Essays
    </button>
  </div>

  <div class="articles">
    <div class="article-card personal">
      <h3>Lately, and Other Things</h3>
      <p>Personal reflections on writing, life, social media, and the things I've been thinking about lately.</p>
      <p><small>Published Nov 14, 2026</small></p>
      <a href="lifeupdate1.html" class="article-btn">Read article</a>
    </div>
  </div>

  <script>
    function showCategory(category, button) {
      const cards = document.querySelectorAll(".article-card");
      const buttons = document.querySelectorAll(".categories button");

      cards.forEach(card => {
        card.style.display = card.classList.contains(category)
          ? "flex"
          : "none";
      });

      buttons.forEach(btn => btn.classList.remove("active"));
      if (button) button.classList.add("active");
    }

    window.addEventListener("load", () => {
      const navToggle = document.querySelector(".nav-toggle");
      const navLinks = document.querySelector(".nav-links");

      if (navToggle && navLinks) {
        navToggle.addEventListener("click", () => {
          navLinks.classList.toggle("active");
        });
      }

      const personalButton = document.querySelector(
        ".categories button[onclick*=\"personal\"]"
      );

      showCategory("personal", personalButton);
    });

    function checkBrainPassword(event) {
      event.preventDefault();
      const password = prompt("Enter password (hint: it's in my book)");

      if (password === "NANU") {
        window.location.href = "my-brain.html";
      } else if (password !== null) {
        alert("Incorrect password.");
      }
    }
  </script>

</body>
</html>
