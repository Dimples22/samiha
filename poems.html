<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Poems</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --fs-xl: clamp(2.5rem, 5vw, 4rem);
      --fs-lg: 1.5rem;
      --fs-md: 1.1rem;
      --fs-sm: 0.9rem;

      --dark-bg: #2C2C2C;
      --dark-gray: #3A3A3A;
      --text-light: #E4E4E4;
      --text-muted: #A8A8A8;

      --accent-cyan: #A8DADC;
      --accent-pink: #FFC1CC;
      --accent-lavender: #B39CD0;

      --shadow: rgba(0, 0, 0, 0.5);
      --border: #555;

      --transition-speed: 0.3s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      line-height: 1.6;
      color: var(--text-light);
      background: var(--dark-bg);
    }

    h1 {
      font-size: var(--fs-xl);
      line-height: 1.2;
    }

    h2 {
      font-size: var(--fs-lg);
      line-height: 1.3;
    }

    a {
      color: var(--accent-cyan);
      text-decoration: none;
      transition: color var(--transition-speed);
    }

    a:hover {
      color: var(--accent-pink);
    }

    /* Navigation */
    .nav {
      background: var(--dark-gray);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 10px 20px;
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .logo {
      font-weight: bold;
      font-size: 1.5rem;
    }

    .nav-links {
      display: grid;
      grid-auto-flow: column;
      gap: 15px;
      list-style: none;
    }

    .nav-links li a {
      display: block;
      padding: 8px 16px;
      border-radius: 6px;
      background: var(--dark-bg);
      text-align: center;
      font-weight: bold;
      transition:
        background var(--transition-speed),
        color var(--transition-speed);
    }

    .nav-links li a:hover {
      background: var(--accent-cyan);
      color: var(--dark-bg);
      text-decoration: none;
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 28px;
      height: 22px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-toggle span {
      display: block;
      height: 3px;
      width: 100%;
      background: var(--text-light);
      border-radius: 2px;
    }

    /* Poetry Section */
    .poetry-section {
      min-height: calc(100vh - 61px);
      padding: 64px 20px;
      display: flex;
      justify-content: center;
    }

    .poetry-container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      text-align: center;
    }

    .poetry-label {
      color: var(--accent-cyan);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
    }

    .poetry-container > h1 {
      margin-bottom: 36px;
    }

    .poem-card {
      background: var(--dark-gray);
      border: 1px solid var(--accent-lavender);
      border-radius: 28px;
      padding: 52px 56px;
      box-shadow: 0 15px 35px var(--shadow);
      transition:
        opacity 0.22s ease,
        transform 0.22s ease;
    }

    .poem-number {
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
    }

    #poemTitle {
      color: var(--accent-lavender);
      margin-bottom: 36px;
      font-size: 1.85rem;
    }


    .poem-text {
      max-width: 720px;
      margin: 0 auto;
      text-align: left;
    }

    .poem-text .stanza {
      margin: 0 0 1.55em 0;
      color: var(--text-light);
      font-size: 1.06rem;
      line-height: 1.55;
      font-weight: 400;
      overflow-wrap: break-word;
    }

    .poem-text .stanza:last-child {
      margin-bottom: 0;
    }

    .poetry-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
    }

    .poem-btn {
      min-height: 44px;
      padding: 12px 24px;
      border: 1px solid var(--border);
      border-radius: 50px;
      background: var(--dark-gray);
      color: var(--text-light);
      font-family: inherit;
      font-size: 0.92rem;
      cursor: pointer;
      transition:
        background var(--transition-speed),
        color var(--transition-speed),
        transform var(--transition-speed),
        border-color var(--transition-speed);
    }

    .poem-btn:hover {
      background: var(--accent-lavender);
      border-color: var(--accent-lavender);
      color: var(--dark-bg);
      transform: translateY(-2px);
    }

    .poem-btn:active {
      transform: scale(0.96);
    }

    footer {
      background: var(--dark-gray);
      color: var(--text-light);
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      border-top: 2px solid var(--accent-lavender);
    }

    footer p {
      font-size: var(--fs-sm);
      margin: 0;
    }

    /* Tablet & Mobile */
    @media (max-width: 768px) {
      .nav-container {
        grid-template-columns: auto auto;
        justify-content: space-between;
      }

      .nav-links {
        display: none;
        grid-auto-flow: row;
        gap: 10px;
        background: var(--dark-gray);
        position: absolute;
        top: 60px;
        right: 20px;
        width: 180px;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 10px 25px var(--shadow);
      }

      .nav-links.active {
        display: grid;
      }

      .nav-toggle {
        display: flex;
      }

      .poetry-section {
        padding: 40px 14px;
      }

      .poem-card {
        padding: 36px 22px;
        border-radius: 22px;
      }

      #poemTitle {
        font-size: 1.55rem;
        margin-bottom: 28px;
      }

      .poem-text .stanza {
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 1.45em;
      }
    }

  
    @media (max-width: 480px) {
      .poetry-section {
        padding: 28px 10px;
      }

      .poem-card {
        padding: 30px 16px;
        border-radius: 18px;
      }

      .poem-text .stanza {
        font-size: 0.96rem;
        line-height: 1.48;
        margin-bottom: 1.35em;
      }

      .poetry-controls {
        gap: 10px;
      }

      .poem-btn {
        padding: 11px 18px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <div class="nav-container">
      <div class="logo">
        Poems
      </div>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#book">Book</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li><a href="projects.html">Projects</a></li>
      </ul>

      <button
        class="nav-toggle"
        id="navToggle"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <main>
    <section class="poetry-section">
      <div class="poetry-container">
        <p class="poetry-label">
          MY POEMS
        </p>

        <div class="poem-card" id="poemCard">
          <p class="poem-number" id="poemNumber">
            1 / 2
          </p>

          <h2 id="poemTitle">
            The Meadow
          </h2>

          <div class="poem-text" id="poemText"></div>
        </div>

        <div class="poetry-controls">
          <button
            class="poem-btn"
            id="prevPoem"
            type="button"
          >
            ← previous
          </button>

          <button
            class="poem-btn"
            id="nextPoem"
            type="button"
          >
            next →
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Samiha. All rights reserved.</p>
  </footer>

  <script>
    const poems = [
      {
        title: "The Meadow",
        stanzas: [
          [
            "In summer, when the meadow wears its bloom,",
            "with buttercups and foxglove bells, one hand",
            "stoops to where a solitary flower sways,",
            "still jewelled with rain, and lifts it from the land."
          ],
          [
            "It is brought home and set within a vase,",
            "and praised for all the beauty it has borne;",
            "yet beauty does not perish when it's gone—",
            "the meadow carries flowering on till morn."
          ],
          [
            "Yet the hand, having plucked one, could not pass another.",
            "Another catches light beyond the hedge;",
            "another, blue as twilight, fills the gloom;",
            "another bends its gold above the sedge."
          ],
          [
            "So one by one the meadow yields its own,",
            "each lovely thing made lovely to be seen—",
            "until the hand, which would not leave alone,",
            "has emptied half the summer from the green."
          ],
          [
            "For what is beautiful is not the flower by itself:",
            "it is the root drinking deep beneath the earth,",
            "the rain beaded along its slender leaves,",
            "the wind that sets each petal trembling into life,",
            "the sun that ripens colour through its veins,",
            "the dark loam that feeds the blossom from beneath."
          ],
          [
            "A severed flower may keep its colour for a while,",
            "may stand in water, seemingly unchanged;",
            "yet something has already perished at the root—",
            "the living earth that gave its beauty birth."
          ],
          [
            "Perhaps it is enough to remain",
            "upon the path, and let the blossoms be;",
            "to watch them bow beneath the summer rain,",
            "then lift their faces to the evening breeze."
          ],
          [
            "For not every flower is meant to go",
            "home in the hand that reaches out to claim;",
            "some things are meant to flourish where they grow,",
            "and answer to the earth from whence they came."
          ]
        ]
      },
      {
        title: "Elixir",
        stanzas: [
          [
            "In this desert, even a cactus becomes interesting",
            "for a little while beneath the vacant sky;",
            "a crooked thing, austere and green, will hold the eye",
            "when there is little else to break the monotony."
          ],
          [
            "They prick, of course, and sometimes draw the blood,",
            "but what are thorns amid so much sand?",
            "And here I am, searching for a water source.",
            "Not for the first cool draught that chance might offer,",
            "nor for some sweetness another draught could bestow,",
            "but for that elixir which has no likeness,",
            "whose very thought makes every other pleasure pale."
          ],
          [
            "To taste the impending doom",
            "of your elixir",
            "and find it sweeter",
            "for knowing what it will take from me."
          ],
          [
            "To feel it upon the tongue,",
            "its sweetness opening slowly through the mouth,",
            "until the breath itself is steeped in it;",
            "to find, mingled with its sweetness, the first touch of doom,",
            "so intimately joined that neither",
            "could be separated from the other."
          ],
          [
            "It is not salvation that I seek,",
            "nor even the end of thirst,",
            "but that exquisite moment before surrender,",
            "when the wanting becomes almost unbearable—",
            "when what has haunted the mouth for so long",
            "is at last poised upon the lips."
          ],
          [
            "So let the thorns draw blood. Let the desert blister",
            "the soles of feet already worn and sore.",
            "Let them prick me once, and then a hundred times;",
            "what are their small wounds, their sting, their score,",
            "beside the rapture waiting at the end of them—",
            "the one draught for which I would bleed once more."
          ]
        ]
      }
    ];

    let currentPoem = 0;

    const poemCard = document.getElementById("poemCard");
    const poemTitle = document.getElementById("poemTitle");
    const poemText = document.getElementById("poemText");
    const poemNumber = document.getElementById("poemNumber");
    const nextButton = document.getElementById("nextPoem");
    const previousButton = document.getElementById("prevPoem");

    function renderStanzas(stanzas) {
      poemText.innerHTML = "";

      stanzas.forEach((lines) => {
        const p = document.createElement("p");
        p.className = "stanza";

        lines.forEach((line, index) => {
          p.appendChild(document.createTextNode(line));
          if (index < lines.length - 1) {
            p.appendChild(document.createElement("br"));
          }
        });

        poemText.appendChild(p);
      });
    }

    function displayPoem(shouldScroll = false) {
      poemCard.style.opacity = "0";
      poemCard.style.transform = "translateY(8px)";

      setTimeout(() => {
        const poem = poems[currentPoem];
        poemTitle.textContent = poem.title;
        renderStanzas(poem.stanzas);
        poemNumber.textContent = `${currentPoem + 1} / ${poems.length}`;

        poemCard.style.opacity = "1";
        poemCard.style.transform = "translateY(0)";

        if (shouldScroll) {
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        }
      }, 200);
    }

    nextButton.addEventListener("click", () => {
      currentPoem = (currentPoem + 1) % poems.length;
      displayPoem(true);
    });

    previousButton.addEventListener("click", () => {
      currentPoem = (currentPoem - 1 + poems.length) % poems.length;
      displayPoem(true);
    });

    const navToggle = document.getElementById("navToggle");
    const navLinks = document.getElementById("navLinks");

    navToggle.addEventListener("click", () => {
      const isOpen = navLinks.classList.toggle("active");
      navToggle.setAttribute("aria-expanded", isOpen);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        nextButton.click();
      }

      if (event.key === "ArrowLeft") {
        previousButton.click();
      }
    });

    displayPoem(false);
  </script>

</body>
</html>
